services:
  kanban:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no arquivo .env}
    volumes:
      - kanban-data:/app/data
volumes:
  kanban-data:
