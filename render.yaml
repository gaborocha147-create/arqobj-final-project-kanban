services:
  - type: web
    name: kanban
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v3/api-docs
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PASSWORD
        generateValue: true
